[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greg-bg"
version = "0.1.0"
description = "Fast, local, customizable AI background remover & image pipeline for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "onnxruntime>=1.19.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "platformdirs>=4.2.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
cuda = [
    "onnxruntime-gpu>=1.19.0",
]
directml = [
    "onnxruntime-directml>=1.19.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
greg = "greg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greg = ["ui/static/*"]
